name: Build

# 没有 Mac 时的编译验证与出包路径。
#
# 推上去自动跑：工程校验 -> XcodeGen 生成 -> 单元测试 -> 构建未签名 ipa。
# 产物在 Actions 运行页的 Artifacts 里下载，拿到 Windows 上用 Sideloadly 签名装机。
#
# 这里同时承担"编译验证"的角色 —— 本机没有 Swift 工具链，
# 这个 workflow 是唯一能告诉你"代码到底编不编得过"的地方。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 必须用带 Xcode 16+ 的 runner。
    # XcodeGen 2.46 生成的是 pbxproj 格式 77（Xcode 16 引入），
    # macos-14 上的 Xcode 15.4 读不了，会报
    # "cannot be opened because it is in a future Xcode project file format (77)"。
    runs-on: macos-15
    timeout-minutes: 40

    # 默认的 GITHUB_TOKEN 权限通常是只读的，推 build-latest 分支需要写权限。
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # runner 上装了多个 Xcode。默认的 xcode-select 指向哪个不确定，
      # 而 SDK 版本直接决定产出的包能不能被目标设备接受 —— 用旧 SDK 出的包
      # 在更高版本的 iOS 上会被 installd 拒收。这里显式挑最新那个。
      - name: 选择最新的 Xcode
        run: |
          set -euo pipefail
          echo "=== 已安装的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 不要用 sort -V：macOS 自带的是 BSD sort，没有 -V。
          # Xcode 的版本号每一段都是 1~2 位数字，字典序等同于数值序，
          # 所以直接取目录名排序后的最后一个即可。
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1 || true)

          if [ -n "${BEST:-}" ] && [ -d "$BEST" ]; then
            echo "选中: $BEST"
            sudo xcode-select -s "$BEST/Contents/Developer"
          else
            echo "::warning::没找到额外的 Xcode，沿用当前设置"
          fi

          echo "=== 生效的工具链 ==="
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK = $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: 工程一致性校验
        run: python3 tools/verify.py

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 列出可用 iPad 模拟器
        run: xcrun simctl list devices available | grep -i ipad || true

      # 单元测试覆盖滑块语义、曲线采样、末端外推、限幅、共享内存往返。
      # 只需要模拟器，不需要真机、不需要广播权限。
      #
      # 失败时把 error: 行提取成 annotation —— 这样没有浏览器也能通过
      # check-runs API 读到确切错误，不必依赖日志下载（那个要认证）。
      - name: 运行单元测试
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];n=[x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad')];sys.exit('no ipad simulator') if not n else print(sorted(n,key=len)[0])")
          echo "使用模拟器: $DEST"

          set +e
          xcodebuild test \
            -project RecoilPad.xcodeproj \
            -scheme RecoilPad \
            -destination "platform=iOS Simulator,name=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcbuild.log | tail -150
          CODE=${PIPESTATUS[0]}
          set -e

          if [ "$CODE" -ne 0 ]; then
            echo "=== xcodebuild 退出码 $CODE，提取错误行 ==="
            grep -E "error:|Unable to read|Reason:" /tmp/xcbuild.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: 构建未签名 IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project RecoilPad.xcodeproj \
            -scheme RecoilPad \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -100

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/RecoilPad.app"
          test -d "$APP" || { echo "::error::没有产出 RecoilPad.app"; exit 1; }

          # 扩展必须被嵌进去，否则装到 iPad 上广播选择器里看不到 RecoilPad。
          # 这是最容易被静默跳过的一步 —— 编译全绿但扩展就是不在。
          test -d "$APP/PlugIns/RecoilPadBroadcast.appex" \
            || { echo "::error::扩展没有被嵌入 PlugIns/"; ls -R "$APP"; exit 1; }
          echo "扩展已嵌入:"
          ls -la "$APP/PlugIns/"

          rm -rf Payload RecoilPad-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RecoilPad-unsigned.ipa Payload
          ls -lh RecoilPad-unsigned.ipa

      # 免费 Apple ID（Personal Team）签不了 App Group —— 带这个 entitlement
      # 的包在签名阶段就会被拒。这里再产一个去掉 App Group 的版本：
      # App 里 SharedRing 检测到容器不可用会自动回退到 loopback 通路。
      # 有付费账号的话用上面那个带 App Group 的包，通路更省资源。
      - name: 构建无 App Group 版本（免费账号用）
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, pathlib

          for name in ("RecoilPad.entitlements", "Broadcast.entitlements"):
              p = pathlib.Path("Support") / name
              with p.open("rb") as fh:
                  data = plistlib.load(fh)
              data.pop("com.apple.security.application-groups", None)
              with p.open("wb") as fh:
                  plistlib.dump(data, fh, fmt=plistlib.FMT_XML)
              print(f"{name}: 去掉 App Group -> {dict(data)}")
          PY

          xcodegen generate
          rm -rf build-nogroup
          xcodebuild build \
            -project RecoilPad.xcodeproj \
            -scheme RecoilPad \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-nogroup \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -40

          APP="build-nogroup/Build/Products/Release-iphoneos/RecoilPad.app"
          test -d "$APP" || { echo "::error::无 App Group 版本构建失败"; exit 1; }
          test -d "$APP/PlugIns/RecoilPadBroadcast.appex" \
            || { echo "::error::无 App Group 版本的扩展没有嵌入"; exit 1; }

          # 目录名必须是 Payload —— iOS 只认这个前缀。
          # 用别的名字（比如 Payload-nogroup）打出来的包结构是错的，
          # 签名能过、安装必失败，而且从文件大小上看不出来。
          rm -rf Payload RecoilPad-unsigned-nogroup.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RecoilPad-unsigned-nogroup.ipa Payload
          ls -lh RecoilPad-unsigned-nogroup.ipa

      - name: 校验两个 IPA 的结构
        run: |
          set -euo pipefail
          for IPA in RecoilPad-unsigned.ipa RecoilPad-unsigned-nogroup.ipa; do
            echo "--- $IPA ---"
            unzip -l "$IPA" | head -20
            unzip -l "$IPA" | grep -q "Payload/RecoilPad.app/RecoilPad" \
              || { echo "::error::$IPA 缺少 Payload/RecoilPad.app/RecoilPad —— 结构不合法，装不上"; exit 1; }
            unzip -l "$IPA" | grep -q "PlugIns/RecoilPadBroadcast.appex/RecoilPadBroadcast" \
              || { echo "::error::$IPA 缺少扩展可执行文件"; exit 1; }
            echo "$IPA 结构 OK"
          done

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: RecoilPad-ipa
          path: |
            RecoilPad-unsigned.ipa
            RecoilPad-unsigned-nogroup.ipa
          if-no-files-found: error
          retention-days: 30

      # Artifacts 需要认证才能下载（匿名请求返回 401），
      # 而 git 通道是通的 —— 所以把产物再推一份到一个单提交的孤儿分支，
      # 用 `git clone --branch build-latest --depth 1` 就能直接取到二进制。
      #
      # 每次都重建孤儿分支并强推：仓库里永远只留最新一份，不会把历史撑大。
      - name: 把 IPA 推回仓库（build-latest 分支）
        continue-on-error: true
        run: |
          set -euo pipefail

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git checkout -q -b build-latest

          cp "$GITHUB_WORKSPACE/RecoilPad-unsigned.ipa" .
          cp "$GITHUB_WORKSPACE/RecoilPad-unsigned-nogroup.ipa" .

          cat > README.txt <<EOF
          RecoilPad 未签名 IPA（自动构建产物）

          构建: $GITHUB_RUN_NUMBER   提交: $GITHUB_SHA   时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          装不上就换另一个：
            RecoilPad-unsigned-nogroup.ipa   免费 Apple ID 用这个（已去掉 App Group）
            RecoilPad-unsigned.ipa           有付费开发者账号用这个

          本分支每次构建都会重建，只有最新一份。
          EOF

          git add -A
          git commit -q -m "build $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            build-latest

          echo "已推送 build-latest"
          ls -lh "$WORK"
