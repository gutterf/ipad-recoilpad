# XcodeGen 项目定义。
#
# 在 Mac 上生成 Xcode 工程：
#     brew install xcodegen
#     cd ipad-recoilpad && xcodegen generate
#
# 为什么要用生成而不是手写 .xcodeproj：
#   两个 target 的文件归属、App Group、扩展内嵌关系全靠 pbxproj 里的 UUID 维系，
#   手写或手改极易出现"文件在但是没编进去"或"扩展没被 embed"这类静默故障。
#   这个文件是唯一事实来源，改归属只改这里。

name: RecoilPad

options:
  bundleIdPrefix: com.yg
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  # ---------------------------------------------------------------- 主 App
  RecoilPad:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    # 界面网页必须作为资源拷进 .app，而不是当源码编译。
    # 放在 sources 里靠扩展名推断也常常管用，但"文件在包里没有"是静默故障 ——
    # 白屏、日志里只有一句加载失败，所以这里显式声明。
    resources:
      - path: App/aim-dashboard.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.recoilpad
        INFOPLIST_FILE: Support/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/RecoilPad.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: RecoilPadBroadcast
        embed: true
        codeSign: true

  # ---------------------------------------------------------- 广播采集扩展
  RecoilPadBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.recoilpad.broadcast
        INFOPLIST_FILE: Support/Broadcast-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Broadcast.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # ------------------------------------------------------------ 单元测试
  #
  # 只覆盖 Shared 里的纯逻辑（弹道曲线、补偿换算、武器库），不碰 UIKit，
  # 所以能在模拟器上秒跑，不需要真机和广播权限。
  RecoilPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.recoilpad.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecoilPad.app/RecoilPad"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RecoilPad

schemes:
  RecoilPad:
    build:
      targets:
        RecoilPad: all
        RecoilPadBroadcast: all
        RecoilPadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RecoilPadTests
